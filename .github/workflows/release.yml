name: release

# Cuts cross-platform `piranha` binaries on every version tag and attaches them
# to the GitHub release. install.sh / install.ps1 download these assets by the
# exact names produced here (piranha-<platform>-<arch>[.exe]).

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to build and release (e.g. v2.0.1)"
        required: true

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.14"

      - name: Install dependencies
        run: bun install --frozen-lockfile || bun install

      # Bun cross-compiles every target from a single Linux host.
      - name: Build all targets
        run: bun run build:all

      - name: List artifacts
        run: ls -la dist/

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.tag || github.ref_name }}
          fail_on_unmatched_files: true
          generate_release_notes: true
          files: |
            dist/piranha-darwin-arm64
            dist/piranha-darwin-x64
            dist/piranha-linux-x64
            dist/piranha-linux-arm64
            dist/piranha-windows-x64.exe
